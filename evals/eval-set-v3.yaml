# vault-retrieval-eval-v3 — frozen benchmark corpus, versioned independently of
# evals/eval-set.yaml (v2). v2's corpus, runner (run_eval.py), and history/
# directory are UNCHANGED and continue running on their own weekly cadence for
# time-series continuity — this is a NEW, additive benchmark, not a migration.
#
# Where v2's categories were topic-domain buckets (clients/infrastructure/
# skills/operations), v3's ten categories are retrieval-CAPABILITY buckets —
# each one isolates a specific way retrieval can go right or wrong. All
# expected_paths/decoy_paths below were verified against the live BS Brain
# vault filesystem (/home/ben_sum/vaults/bs-brain) on 2026-08-20 by direct
# read, not guessed or copied from an older report.
#
# Schema per entry:
#   question       (required) natural-language query
#   category       (required) one of the ten below
#   expected_paths (required) vault-root-relative correct answer path(s).
#                  Empty list ONLY when negative: true.
#   category_note  (optional) why this question belongs to this category —
#                  completion-criterion "expected paths / current-vs-history
#                  intent justified".
#   decoy_paths    (optional) known-wrong paths a naive keyword/semantic match
#                  could surface instead — a stale duplicate, a superseded/
#                  retired document, or a topically-adjacent-but-unrelated
#                  file. Used for answer-level source-correctness scoring,
#                  not for R@5/MRR.
#   negative       (optional, default false) true for genuinely unanswerable
#                  questions (category: negative_unknown) — no correct path
#                  exists anywhere in the vault. Scored as source-correctness
#                  only (did the tool avoid confidently returning a decoy),
#                  never as a plain R@5/MRR hit since expected_paths is empty.
#   require_all    (optional, default false) for cross_document questions:
#                  true means a full "synthesis hit" requires ALL
#                  expected_paths to appear somewhere in the top-N, not just
#                  one (see run_eval_v3.py's synthesis_hit metric).
#
# Corpus hash/version freeze: see evals/history-v3/CORPUS_HASH (written by
# run_eval_v3.py's --freeze-corpus step). Any edit to this file after the
# freeze must bump the version comment below and re-run --freeze-corpus
# deliberately — the runner's startup guard fails loudly on a silent
# corpus-hash drift once frozen.
#
# corpus_version: v3.0.0

