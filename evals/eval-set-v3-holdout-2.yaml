# eval-set-v3-holdout-2.yaml -- fresh, hashed, POST-IMPLEMENTATION holdout for
# vault-retrieval-r5-085-v1.
#
# Purpose: this build's diagnosis and calibration (RRF_K, canonical-boost,
# eval-report exclusion, semantic candidate-pool depth) all used
# eval-set-v3.yaml and eval-set-v3-holdout.yaml. This file contains 22
# NEW questions, over NEW documents/facts than any of those two files
# (verified below), weighted toward paraphrase / entities_aliases /
# specific-fact / current_vs_stale per this build's spec. Built and hashed
# BEFORE this build's final implementation was scored against it. No code or
# weight change may occur after this file is scored -- if it fails, the
# build fails honestly rather than tuning to it (see spec step 6).
#
# Corpus: same live BS Brain vault filesystem as eval-set-v3.yaml.
# Scoring: reuses run_eval_v3.py's score_entry/run_tool_eval_v3, same
# R@5/MRR/source_correctness definitions, via evals/run_holdout2_eval.py.
#
# Non-overlap check performed before writing this file: none of the 20
# expected_paths below appear in eval-set-v3.yaml's or eval-set-v3-
# holdout.yaml's expected_paths/decoy_paths lists (checked by direct diff
# against both files' full path lists).
#
# HARD RULE: never look at run results against this file and then edit a
# question's wording or expected_paths to make it pass. If a question is
# later found to be ambiguous/broken, it must be replaced with a NEW question
# over a NEW fact, re-hashed, and the old result discarded and re-run in
# full, not patched in place.

