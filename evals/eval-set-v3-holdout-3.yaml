# --- current_vs_stale (6) ------------------------------------------------------

- question: "As things stand today, is Erica Berchtold's investment-loan rate at Westpac Private 6.39% or 6.38%?"
  category: current_vs_stale
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Berchtold, Erica.md"
  decoy_paths: []
  category_note: >
    Tests current-state accuracy: "current INV rate confirmed at 6.38%
    (previously carried as a 6.39% estimate)" -- the 6.39% figure is an
    explicitly superseded estimate recorded in the same document.

- question: "Right now, is Claude and Simone Concha's refinance held with Heritage Bank or with NAB?"
  category: current_vs_stale
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Concha, Claude & Concha, Simone.md"
