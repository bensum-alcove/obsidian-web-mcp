# eval-set-v3-holdout-3.yaml -- fresh, hashed, BLIND generalisation holdout for
# vault-retrieval-entity-resolution-r5-v2.
#
# Purpose: the implementation this build owns (entity/alias/situational-
# descriptor candidate leg in vault_query, plus H1-alias and occupation-
# descriptor extraction in dreaming.py) was diagnosed and calibrated entirely
# against eval-set-v3.yaml, eval-set-v3-holdout.yaml, and eval-set-v3-
# holdout-2.yaml. This file contains 24 NEW questions, over NEW client files
# and NEW infrastructure facts never referenced by any of those three files
# (verified below), weighted evenly across paraphrase / entities_aliases /
# exact_identifiers / current_vs_stale per this build's spec. Built and
# hashed BEFORE this build's implementation was scored against it. No code or
# config change may occur after this file is scored -- if it fails, the
# build fails honestly rather than tuning to it (see spec step 7).
#
# Non-overlap check performed before writing this file: none of the
# expected_paths below appear in eval-set-v3.yaml's, eval-set-v3-holdout.
# yaml's, or eval-set-v3-holdout-2.yaml's expected_paths/decoy_paths lists
# (checked by direct diff against all three files' full path lists).
# Every fact below was read directly from the live vault before being turned
# into a question -- none is copied from, or reverse-engineered against, this
# build's own code paths or test fixtures.
#
# Corpus: same live BS Brain vault filesystem as eval-set-v3.yaml.
# Scoring: reuses run_eval_v3.py's score_entry/run_tool_eval_v3, same
# R@5/MRR/source_correctness definitions, via evals/run_holdout3_eval.py.
#
# HARD RULE: never look at run results against this file and then edit a
# question's wording or expected_paths to make it pass. If a question is
# later found to be ambiguous/broken, it must be replaced with a NEW question
# over a NEW fact, re-hashed, and the old result discarded and re-run in
# full, not patched in place.

# --- paraphrase (6) ----------------------------------------------------------

- question: "A cardiologist client got a surprise rate offer from a competing major bank out of the blue -- what reason did the broker give for doubting the quoted rate was actually still on the table?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Cheruvu, Sarat.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "ANZ's cold-call offer... likely predates the RBA's May
    2026 hike... supports the stale-rate theory" -- avoids "cold-call",
    "ANZ", and "RBA hike" in favor of "surprise rate offer" and "doubting the
    quoted rate". Different client/fact than any known entry.

- question: "For the commercial property leased to a government tenant that one client owns, roughly how many years of lease term were locked in when the deal was structured, all up?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Duff, Scott & Tracey.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "Government tenant (Department of Home Affairs), 7+5
    lease" -- avoids "Department of Home Affairs" and the literal "7+5" in
    favor of "government tenant" and "all up". Answer requires adding the
    two lease terms together, not just quoting a single number verbatim.

- question: "For the household doing a renovation equity-release through their existing bank, why did the lender approve a smaller top-up than what their income could actually support?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/De Bortoli, Melissa & Sortino, Luke.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "Serviceability supports the $255,000 request; the
    constraint is LVR, not income" -- avoids "serviceability" and "LVR" in
    favor of "why...smaller" and "income could actually support".

- question: "One applicant's move to reduced working hours cut her usable income by roughly what percentage, comparing her current annualised pay to her last full financial year's figure?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Cheruvu, Gouri & Cheruvu, Chaitu.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "current annualised salary $107,438...significantly below
    FY25's $194,820" -- avoids "0.6 FTE" and "part time" in favor of
    "reduced working hours" and asks for a derived percentage, not a quoted
    figure.

- question: "What's the property-investing game plan for the client who wants to buy, do up, and flip a home every couple of years while swapping whose name it's under each time?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Clients/Boyd, Nick.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "manufacture equity by buying a PPOR, renovating, and
    selling after 2+ years (tax-free CGT as PPOR)...alternating ownership
    between himself and his wife" -- avoids "manufacture equity", "CGT", and
    "PPOR" in favor of "game plan" and "swapping whose name it's under".

- question: "Roughly how large, in plain characters, is the ephemeral session-cache file allowed to grow before it's considered over its limit?"
  category: paraphrase
  expected_paths:
    - "BS 2nd Brain/Alcove/Infrastructure/hot-md-structure.md"
  decoy_paths: []
  category_note: >
    Paraphrase of "Whole-file character budget (frontmatter excluded):
    5,000 chars" -- avoids "hot.md" and "budget" in favor of "ephemeral
    session-cache file" and "over its limit".

