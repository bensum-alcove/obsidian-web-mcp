    Tests current-state accuracy: "Previously listed as Heritage Bank (HSL)
    in pricing tool - corrected to NAB" -- the frontmatter `lender` field
    itself still says Heritage Bank, but the body explicitly corrects it to
    NAB as the true current lender.

- question: "Does Benjamin and Aurelie's St George preapproval still stand today, or has it lapsed?"
  category: current_vs_stale
